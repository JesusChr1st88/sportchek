<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Прогрессия">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Прогрессия — журнал тренировок</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="top">
  <header>
    <div class="grow">
      <button class="hdTitle" id="hdTitle" data-act="openCycle"></button>
      <div class="hdSub" id="hdSub"></div>
    </div>
  </header>
  <div id="segbar"></div>
</div>

<main id="app"></main>

<div id="toast" role="status" aria-live="polite"></div>

<div id="restbar">
  <svg class="restRing" viewBox="0 0 50 50" width="40" height="40"><circle cx="25" cy="25" r="21" class="bgc"/><circle id="restRing" cx="25" cy="25" r="21" class="fg"/></svg>
  <span class="grow"><span id="restT" class="num">0:00</span><span id="restL">отдых</span></span>
  <button class="pill grey sm" data-act="restAdd" data-a="30">+30 с</button>
  <button class="pill sm dark" data-act="restStop">Стоп</button>
</div>

<div id="sheetwrap"><div class="scrim" data-act="closeSheet"></div><div id="sheet"></div></div>

<nav>
  <button data-act="tab" data-a="home"><span class="navDot" id="navDot" style="display:none"></span>
    <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
  <button data-act="tab" data-a="program">
    <svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></svg>Программа</button>
  <button data-act="tab" data-a="food">
    <svg viewBox="0 0 24 24"><path d="M12 7.5c-1.2-1-4.8-1.6-6.2 1.3-1.5 3 .3 8.5 2.8 10.4 1.2.9 2.3.6 3.4.1 1.1.5 2.2.8 3.4-.1 2.5-1.9 4.3-7.4 2.8-10.4-1.4-2.9-5-2.3-6.2-1.3z"/><path d="M12 7.5c0-2 1-3.5 3-4"/></svg>Питание</button>
  <button data-act="tab" data-a="progress">
    <svg viewBox="0 0 24 24"><path d="M4 19h16M7 15v-3M12 15V8M17 15V5"/></svg>Прогресс</button>
  <button data-act="tab" data-a="profile">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-3.6 3.8-5.6 7.5-5.6s6.7 2 7.5 5.6"/></svg>Профиль</button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
