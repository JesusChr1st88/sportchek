<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Прогрессия">
<meta name="theme-color" content="#15141B">
<title>Прогрессия — журнал тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Тёмное приложение, один уверенный акцент индиго→синий + честный светофор RIR */
    --bg:#0A0A10; --bg2:#101019; --surface:#16151F; --surface2:#1E1D29;
    --stroke:rgba(255,255,255,.08); --stroke2:rgba(255,255,255,.15);
    --ink:#F5F4FA; --muted:#9C98AC; --dim:#615D70;

    --violet:#7C5CFC; --violetLight:#9B82FF; --blue:#4C8DFF; --cyan:#3DDBD9;
    --tGreen:#31D67A; --tYellow:#FFC531; --tRed:#FF4D5E;

    --gradPrimary:linear-gradient(135deg,var(--violet),var(--blue));
    --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,monospace;
    --disp:'Oswald',ui-condensed,'Arial Narrow',sans-serif;
    --body:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
    padding-bottom:calc(140px + env(safe-area-inset-bottom));overscroll-behavior-y:none;position:relative;min-height:100%;
    transition:padding-bottom .15s ease;
  }
  body.resting{padding-bottom:calc(214px + env(safe-area-inset-bottom))}
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:radial-gradient(110% 60% at 50% -10%, rgba(124,92,252,.16), transparent 60%),
               radial-gradient(80% 50% at 100% 105%, rgba(76,141,255,.10), transparent 60%),
               var(--bg);
  }
  body::after{content:"";position:fixed;inset:0;z-index:-1;
    background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
    background-size:24px 24px;pointer-events:none}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  header{position:sticky;top:0;z-index:20;
    background:rgba(10,10,16,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid var(--stroke)}
  header h1{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink)}
  header .sub{font-size:11.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.2px;margin-top:2px}
  .icon-btn{background:var(--surface2);border:1px solid var(--stroke2);color:var(--ink);border-radius:12px;
    width:42px;height:42px;font-size:18px;display:flex;align-items:center;justify-content:center}
  .icon-btn.sm{width:34px;height:34px;font-size:16px;border-radius:10px;flex:none}
  .icon-btn:active{transform:scale(.92)}

  main{padding:16px 14px 150px;max-width:600px;margin:0 auto}
  .card,details.card{
    background:var(--surface);border:1px solid var(--stroke);border-radius:16px;padding:15px;margin-bottom:13px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .card h2{font-family:var(--disp);font-size:16.5px;font-weight:600;margin-bottom:4px;letter-spacing:.3px;text-transform:uppercase;color:var(--ink)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted);font-size:13px}
  .dim{color:var(--dim)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  .plate{width:9px;height:9px;border-radius:50%;flex:none}
  .plate.g{background:var(--tGreen)} .plate.y{background:var(--tYellow)} .plate.r{background:var(--tRed)}
  .tl-dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle}
  .tl-dot.g{background:var(--tGreen)} .tl-dot.y{background:var(--tYellow)} .tl-dot.r{background:var(--tRed)}

  button{font:inherit;color:inherit;cursor:pointer}
  .btn{display:block;width:100%;padding:15px;border-radius:13px;border:none;font-family:var(--disp);
    font-size:15px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:var(--gradPrimary);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 8px 22px rgba(76,90,255,.28)}
  .btn:active{transform:translateY(1px) scale(.99)}
  .btn.ghost{background:var(--surface2);border:1px solid var(--stroke2);color:var(--ink);box-shadow:none}
  .btn.danger{background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.6);color:#FF8792;box-shadow:none;font-weight:700}
  .btn.sm{width:auto;padding:10px 16px;font-size:13px;border-radius:11px}
  .btn:disabled{opacity:.4}

  /* нижняя навигация с приподнятой центральной кнопкой */
  nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;align-items:flex-end;
    background:rgba(9,9,14,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--stroke);padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:none;color:var(--dim);padding:11px 0 9px;font-size:10px;display:flex;
    flex-direction:column;align-items:center;gap:4px;font-family:var(--disp);font-weight:600;letter-spacing:.3px;
    text-transform:uppercase;position:relative}
  nav button.on{color:var(--violetLight)}
  nav button.on::before{content:"";position:absolute;top:0;width:20px;height:2px;background:var(--violetLight)}
  nav button .ico{font-size:19px;line-height:1;filter:grayscale(.5) contrast(1.1) brightness(1.3)}
  nav button.on .ico{filter:none}
  nav button:active{opacity:.7}
  nav button.navCenter{color:var(--ink);padding-top:0}
  nav button.navCenter::before{display:none}
  nav button.navCenter .ico{
    width:54px;height:54px;display:flex;align-items:center;justify-content:center;
    background:var(--gradPrimary);border-radius:50%;font-size:23px;margin-top:-24px;
    box-shadow:0 8px 22px rgba(124,92,252,.55),0 0 0 5px var(--bg);filter:none}
  nav button.navCenter.on .ico{box-shadow:0 8px 26px rgba(124,92,252,.75),0 0 0 5px var(--bg)}
  nav button.navCenter:active .ico{transform:scale(.94)}

  .step{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--stroke2);border-radius:12px;overflow:hidden}
  .step button{width:44px;height:50px;background:none;border:none;color:var(--violetLight);font-size:23px;font-weight:600;flex:none}
  .step button:active{transform:scale(.9)}
  .step input{width:70px;height:50px;background:none;border:none;color:var(--ink);text-align:center;
    font-family:var(--disp);font-size:20px;font-weight:600;-moz-appearance:textfield}
  .step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
  .fieldlbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;font-family:var(--disp);font-weight:600}

  .ddWrap{position:relative}
  .ddSelect{width:100%;background:var(--surface2);border:1px solid var(--stroke2);border-radius:11px;
    color:var(--ink);padding:13px 36px 13px 13px;font-size:15px;font-family:inherit;font-weight:600;
    -webkit-appearance:none;appearance:none}
  .ddArrow{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:12px}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:3px 0;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:9px 13px;border-radius:10px;border:1px solid var(--stroke2);background:var(--surface2);
    color:var(--muted);font-family:var(--mono);font-size:14px;font-weight:600}
  .chip.on{color:#fff;border-color:transparent;font-weight:700;background:var(--violet)}
  .chip.on.b{background:var(--blue)}
  .chip:active{transform:scale(.95)}

  /* светофор RIR — крупные кнопки вместо цифр RPE */
  .tlRow{display:flex;gap:8px}
  .tl{flex:1;border-radius:13px;border:1.5px solid var(--stroke2);background:var(--surface2);padding:12px 4px;
    display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
  .tl:active{transform:scale(.96)}
  .tl b{font-family:var(--disp);font-size:13px;text-transform:uppercase;letter-spacing:.3px;color:inherit}
  .tl span{font-size:10px;color:inherit;opacity:.85;text-align:center}
  .tl.g{border-color:rgba(49,214,122,.4)} .tl.y{border-color:rgba(255,197,49,.4)} .tl.r{border-color:rgba(255,77,94,.4)}
  .tl.g.on{background:var(--tGreen);border-color:transparent;color:#04220f}
  .tl.y.on{background:var(--tYellow);border-color:transparent;color:#2b1c00}
  .tl.r.on{background:var(--tRed);border-color:transparent;color:#fff}

  .setline{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px dashed var(--stroke)}
  .setline .num{width:22px;color:var(--dim);font-family:var(--mono);font-size:13px}
  .setline .res{font-family:var(--mono);font-size:16px;font-weight:600}
  .bigw{font-family:var(--disp);font-size:32px;font-weight:700;letter-spacing:0;color:var(--violetLight)}
  .bigw small{font-size:13px;color:var(--muted);font-weight:600}
  .hint{background:var(--surface2);border:1px solid var(--stroke);border-left:3px solid var(--violet);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--muted);margin-top:9px}
  .hint b{color:var(--ink)}

  .weekBadge{display:inline-flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--stroke2);
    border-radius:11px;padding:9px 13px;font-size:12.5px;color:var(--muted);margin-bottom:13px;font-family:var(--mono)}
  .weekBadge .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .weekBadge.tier-g .dot{background:var(--tGreen)} .weekBadge.tier-y .dot{background:var(--tYellow)}
  .weekBadge.tier-r .dot{background:var(--tRed)} .weekBadge.tier-blue .dot{background:var(--blue)}
  .weekBadge b{color:var(--ink)}

  /* тост */
  #toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:60;
    background:var(--gradPrimary);color:#fff;padding:11px 18px;border-radius:30px;font-family:var(--disp);
    font-weight:600;font-size:12.5px;letter-spacing:.3px;box-shadow:0 10px 30px rgba(124,92,252,.5);
    transition:transform .4s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{transform:translate(-50%,0)}

  /* таймер отдыха — кольцо */
  #restbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;
    background:var(--surface2);border:1px solid var(--stroke2);border-radius:16px;padding:9px 15px;
    display:none;align-items:center;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
  #restbar.show{display:flex}
  .restRing{flex:none;transform:rotate(-90deg)}
  .restRing .ringBg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:5}
  .restRing .ringFg{fill:none;stroke:var(--violetLight);stroke-width:5;stroke-linecap:round;
    stroke-dasharray:169.6;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear}
  #restbar .t{font-family:var(--disp);font-size:22px;font-weight:700;min-width:56px;color:var(--ink)}

  #sheetwrap{position:fixed;inset:0;z-index:50;display:none}
  #sheetwrap.show{display:block}
  #sheetwrap .bgc{position:absolute;inset:0;background:rgba(4,4,8,.68)}
  #sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;
    background:var(--bg2);border-radius:20px 20px 0 0;
    padding:20px 16px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--stroke2)}
  #sheet h3{font-family:var(--disp);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:15px}
  .frow{margin-bottom:14px}
  .frow input[type=text],.frow input[type=password]{width:100%;background:var(--surface2);border:1px solid var(--stroke2);border-radius:11px;
    color:var(--ink);padding:13px;font-size:16px}
  .two{display:flex;gap:10px}.two>*{flex:1}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:13px;background:var(--surface2);
    border:1px solid var(--stroke2);border-radius:11px}
  .exrow{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--stroke)}
  .exrow:first-of-type{border-top:none}
  .exrow .mv{color:var(--dim);background:none;border:none;font-size:18px;padding:6px}
  .exrow .mv:active,.mv:active{transform:scale(.9)}
  .tag{font-size:11px;padding:4px 9px;border-radius:8px;background:var(--surface2);border:1px solid var(--stroke2);color:var(--violetLight);font-family:var(--mono);font-weight:600}
  svg{display:block}
  .empty{text-align:center;color:var(--dim);padding:34px 12px;font-size:14px}
  details summary{list-style:none;cursor:pointer}
  details summary::-webkit-details-marker{display:none}
  pre{font-family:var(--mono)}
  ol{color:var(--muted)}

  /* мезоцикл — блины на грифе, цвета совпадают со светофором подхода */
  .meso{display:flex;align-items:stretch;justify-content:space-between;gap:4px;border-bottom:2px solid var(--stroke2);
    padding:6px 0 12px}
  .mesoItem{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0}
  .mesoPlateWrap{height:72px;width:100%;display:flex;align-items:flex-end;justify-content:center}
  .mesoPlate{border-radius:50%;border:3px solid var(--pc);display:flex;align-items:center;justify-content:center;
    font-family:var(--disp);font-weight:700;font-size:16px;color:var(--pc);flex:none;
    background:color-mix(in srgb, var(--pc) 14%, transparent)}
  .mesoItem.active .mesoPlate{border-width:4px;box-shadow:0 0 0 3px color-mix(in srgb, var(--pc) 26%, transparent)}
  .mesoLbl{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.2px;color:var(--ink);white-space:nowrap}
  .mesoItem:not(.active) .mesoLbl{color:var(--dim)}

  /* календарь: фиксированная высота ячеек — стабильно во всех WebKit */
  .calWeekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:4px}
  .calWeekdays span{text-align:center;font-size:10.5px;color:var(--dim);font-family:var(--mono);padding-bottom:4px}
  .calGrid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:44px;gap:3px}
  .calCell{height:44px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
  .calCell.has{background:var(--surface2);border:1px solid var(--stroke2);color:var(--ink)}
  .calCell.today{outline:1.5px solid var(--violetLight);outline-offset:-1.5px}
  .calCell.empty{visibility:hidden}
  .calDots{display:flex;gap:2px;height:5px}
  .calDot{width:5px;height:5px;border-radius:50%;background:var(--violet)}
  .calDot.d0{background:var(--violet)} .calDot.d1{background:var(--blue)} .calDot.d2{background:var(--cyan)}
  .calDot.d3{background:var(--violetLight)}
  .calLegend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--stroke)}
  .legendItem{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .legendItem .calDot{width:7px;height:7px}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div>
    <h1 id="hTitle">Прогрессия</h1>
    <div class="sub" id="hSub"></div>
  </div>
  <button class="icon-btn" onclick="openSettings()" aria-label="Данные и настройки">⚙︎</button>
</header>

<main id="app"></main>

<div id="toast"></div>

<div id="restbar">
  <svg class="restRing" viewBox="0 0 64 64" width="52" height="52">
    <circle cx="32" cy="32" r="27" class="ringBg"/>
    <circle id="restRing" cx="32" cy="32" r="27" class="ringFg"/>
  </svg>
  <span class="t" id="restT">0:00</span>
  <div class="grow"></div>
  <button class="btn ghost sm" onclick="restAdd(30)">+30</button>
  <button class="btn sm" onclick="restStop()">Стоп</button>
</div>

<div id="sheetwrap">
  <div class="bgc" onclick="closeSheet()"></div>
  <div id="sheet"></div>
</div>

<nav>
  <button data-tab="calendar" onclick="setTab('calendar')"><span class="ico">📅</span>Календарь</button>
  <button data-tab="program" onclick="setTab('program')"><span class="ico">📋</span>Программа</button>
  <button data-tab="workout" onclick="setTab('workout')" class="navCenter"><span class="ico">🏋️</span>Тренировка</button>
  <button data-tab="progress" onclick="setTab('progress')"><span class="ico">📈</span>Прогресс</button>
  <button data-tab="results" onclick="setTab('results')"><span class="ico">🏆</span>Результаты</button>
</nav>

<script>
'use strict';
/* ============ данные ============ */
const LS_KEY='gymlog.v2';
const RPE_PCT={
  '10':[1,.96,.92,.89,.86,.84,.81,.79,.76,.74],
  '9.5':[.98,.94,.91,.88,.85,.82,.80,.77,.75,.72],
  '9':[.96,.92,.89,.86,.84,.81,.79,.76,.74,.71],
  '8.5':[.94,.91,.88,.85,.82,.80,.77,.75,.72,.69],
  '8':[.92,.89,.86,.84,.81,.79,.76,.74,.71,.68],
  '7.5':[.91,.88,.85,.82,.80,.77,.75,.72,.69,.67],
  '7':[.89,.86,.84,.81,.79,.76,.74,.71,.68,.65],
  '6.5':[.88,.85,.82,.80,.77,.75,.72,.69,.67,.64]
};
const RPE_LIST=[6.5,7,7.5,8,8.5,9,9.5,10];
let uidN=1; const uid=()=>'id'+Date.now().toString(36)+(uidN++);

function defaultState(){
  const ex=(name,sets,repMin,repMax,step,rest,seed,bw,mrv,heavy)=>({id:uid(),name,sets,repMin,repMax,step,rest,seedE1RM:seed||null,bw:!!bw,mrv:mrv||(sets+2),heavy:!!heavy});
  return {
    v:1,
    ui:{tab:'workout',progressEx:null},
    settings:{},
    program:{days:TEMPLATES.fullbody.build(),custom:{fullbody:TEMPLATES.fullbody.build(),split:TEMPLATES.split.build()}},
    history:[],
    active:null,
    meta:{updatedAt:0}
  };
}
const TEMPLATES={
  fullbody:{
    label:'Фулбоди · 3 дня',
    note:'Каждая мышечная группа нагружается 3×/нед — надёжная база по частоте (Schoenfeld et al., 2018).',
    build:()=>{
      const ex=(name,sets,repMin,repMax,step,rest,seed,bw,mrv,heavy)=>({id:uid(),name,sets,repMin,repMax,step,rest,seedE1RM:seed||null,bw:!!bw,mrv:mrv||(sets+2),heavy:!!heavy});
      return [
      {id:uid(),name:'Фулбоди 1 · присед + жим',exercises:[
        ex('Приседания со штангой',3,5,8,2.5,210,null,false,4,true),
        ex('Жим штанги лёжа',3,5,8,2.5,180,94,false,4,true),
        ex('Тяга вертикального блока',3,8,10,2.5,120,68,false,5),
        ex('Махи гантелями в стороны',3,12,15,1,75,11,false,5),
        ex('Разгибания рук на блоке',3,10,12,2.5,75,38,false,5),
        ex('Скручивания',3,12,20,0,60,null,true,5)
      ]},
      {id:uid(),name:'Фулбоди 2 · тяга + плечи',exercises:[
        ex('Румынская тяга',3,6,8,2.5,180,110,false,4,true),
        ex('Жим гантелей сидя',3,6,10,2.5,150,50,false,5),
        ex('Тяга горизонтального блока',3,8,12,2.5,120,60,false,5),
        ex('Жим платформы ногами',3,8,12,5,150,202,false,5),
        ex('Подъём штанги на бицепс',3,8,12,2.5,75,28,false,5),
        ex('Подъёмы на носки',3,12,15,5,60,null,false,5)
      ]},
      {id:uid(),name:'Фулбоди 3 · смешанный',exercises:[

/* ============ расчёты ============ */
function pct(rpe,reps){
  reps=Math.max(1,Math.min(10,Math.round(reps)));
  let key=String(rpe);
  if(!RPE_PCT[key]){ // ближайший
    let best=8,bd=99;
    RPE_LIST.forEach(r=>{const d=Math.abs(r-rpe);if(d<bd){bd=d;best=r;}});
    key=String(best);
  }
  return RPE_PCT[key][reps-1];
}
const TIER_RPE={g:7,y:8.5,r:10};
const TIER_ORDER={g:0,y:1,r:2};
const TIER_TITLE={g:'Зелёный',y:'Жёлтый',r:'Красный'};
const TIER_SUB={g:'3+ до отказа',y:'1–2 до отказа',r:'Отказ'};
function e1rmOfSet(s){
  if(!s||!s.w||!s.r) return null;
  if(s.r<=10 && s.tier) return s.w/pct(TIER_RPE[s.tier],s.r);
  return s.w*(1+s.r/30); // Epley
}
function roundStep(w,step){ if(!step) return Math.round(w*10)/10; return Math.round(w/step)*step; }
function fmtW(w){ return (Math.round(w*100)/100).toString().replace('.',','); }

/* ============ периодизация: MEV→MRV за 3 недели + разгрузка, циклично ============ */
function weekInCycleForIndex(i){ return (Math.floor(i/3)%4)+1; } // 1,2,3 — рабочие недели, 4 — разгрузка
function currentWeekInCycle(){ return weekInCycleForIndex(S.history.length); }
function phaseFor(ex,week){
  const mev=ex.sets, mrv=ex.mrv||(ex.sets+2);
  if(week===4) return {sets:Math.max(1,Math.round(mrv*0.5)), tier:'g', deload:true};
  if(week===1) return {sets:mev, tier:'g', deload:false};
  if(week===2) return {sets:Math.round(mev+(mrv-mev)/2), tier:'y', deload:false};
  return {sets:mrv, tier:'r', deload:false}; // неделя 3 — пик
}
function weekLabel(week){ return week===4?'Разгрузка':('Неделя '+week+' из 3'); }
/* Межцикловая прогрессия (Israetel, Renaissance Periodization): после каждого завершённого
   мезоцикла (12 тренировок) MEV подрастает на 1 подход, до потолка в 6 жёстких подходов на
   упражнение за сессию — иначе паттерн 3-4-5-разгрузка повторялся бы бесконечно без учёта
   роста тренированности. Тяжёлые базовые движения (heavy: приседания, становая, жимы штанги,
   тяга штанги в наклоне) из этого правила исключены: по данным RP (rpstrength.com,
   Training Volume Landmarks) у многосуставных штанговых движений системная утомляемость на
   подход выше, а восстановимый объём — ниже и уже, чем у изоляции/тренажёров, поэтому их
   долгосрочная прогрессия идёт через нагрузку (вес, расчётный 1ПМ) и приближение к отказу
   (светофор), а не через бесконечный рост числа подходов. */
const MEV_CAP=5;
function maybeAdvanceMesocycle(){
  const i=S.history.length-1;
  if(i>=0 && i%12===11){
    S.program.days.forEach(d=>d.exercises.forEach(ex=>{
      if(ex.heavy) return;
      ex.sets=Math.min(ex.sets+1,MEV_CAP);
      ex.mrv=Math.max(ex.mrv,ex.sets+1);
    }));
    return true;
  }
  return false;
}

function lastResults(exName,limit){
  const out=[];
  for(let i=S.history.length-1;i>=0;i--){
    const w=S.history[i];
    for(const en of w.entries){
      if(en.name===exName && en.sets.some(s=>s.r)){
        out.push({date:w.date,sets:en.sets.filter(s=>s.r)});
        break;
      }
    }
    if(limit&&out.length>=limit) break;
  }
  return out;
}
function currentE1RM(ex){
  const res=lastResults(ex.name,3);
  let best=null;
  for(const r of res.slice(0,1)){ // последняя сессия
    for(const s of r.sets){ const v=e1rmOfSet(s); if(v&&(!best||v>best)) best=v; }
  }
  if(best) return best;
  // ищем глубже
  for(const r of res){ for(const s of r.sets){ const v=e1rmOfSet(s); if(v&&(!best||v>best)) best=v; } }
  return best||ex.seedE1RM||null;
}
function recommend(ex){
  const week=currentWeekInCycle();
  const phase=phaseFor(ex,week);
  if(ex.bw){
    const res=lastResults(ex.name,1);
    let reps=null;
    if(res.length) reps=Math.max(...res[0].sets.map(s=>s.r||0))+1;
    return {bw:true,reps,sets:phase.sets,tier:phase.tier,deload:phase.deload};
  }
  const e=currentE1RM(ex);
  if(!e) return {bw:false,w:null,sets:phase.sets,tier:phase.tier,deload:phase.deload};
  const w=roundStep(e*pct(TIER_RPE[phase.tier],ex.repMin),ex.step||2.5);
  return {bw:false,w,e1rm:e,sets:phase.sets,tier:phase.tier,deload:phase.deload};
}
/* подсказка на следующий подход: сравниваем цвет светофора факта с целевым */
function nextSetHint(ex,prev){
  if(ex.bw||!prev||!prev.w) return null;
  if(!prev.tier) return {w:prev.w,note:'тот же вес'};
  const step=ex.step||2.5;
  const target=TIER_ORDER[ex.tier], got=TIER_ORDER[prev.tier];
  const diff=got-target;
  if(diff===0) return {w:prev.w,note:'в целевой зоне'};
  const delta=step*Math.abs(diff);
  if(diff>0) return {w:Math.max(0,prev.w-delta),note:diff===1?'было тяжелее цели — снизь':'было заметно тяжелее цели — снизь сильнее'};
  return {w:prev.w+delta,note:diff===-1?'было легче цели — добавь':'было заметно легче цели — добавь сильнее'};
}

        '<div class="fieldlbl" style="margin-top:10px">Как прошёл подход? (цель — '+TIER_TITLE[en.tier]+')</div>'+
        tlRow(ei,en.draft.tier)+
        hintHtml+
        '<button class="btn" style="margin-top:12px" onclick="logSet('+ei+')" '+(en.draft.tier?'':'disabled')+'>Записать подход '+(done+1)+' из '+en.planSets+'</button>'+
      '</div>';
    } else {
      entry='<div class="hint" style="margin-top:8px">Упражнение выполнено ✓ <button class="btn ghost sm" style="display:inline-block;width:auto;margin-left:8px" onclick="extraSet('+ei+')">+ подход</button></div>';
    }
    h+='<details class="card"'+openAttr+'><summary class="row">'+
      '<span class="plate '+en.tier+'"></span>'+
      '<div class="grow"><h2>'+esc(en.name)+'</h2><div class="muted">'+en.planSets+'×'+en.repMin+'–'+en.repMax+' · цель '+TIER_TITLE[en.tier]+
      (en.rest?(' · отдых '+en.rest+'с'):'')+'</div></div>'+
      '<span class="tag">'+done+'/'+en.planSets+'</span></summary>'+setsHtml+entry+'</details>';
  });
  h+='<button class="btn" onclick="finishWorkout()">Завершить тренировку</button>'+
     '<button class="btn danger" style="margin-top:10px" onclick="cancelWorkout()">✕ Отменить без сохранения</button>';
  return h;
}
function tlRow(ei,current){
  const opts=[['g','Легко','3+ до отказа'],['y','Средне','1–2 до отказа'],['r','Тяжело','Отказ']];
  let h='<div class="tlRow">';
  opts.forEach(([k,title,sub])=>{
    h+='<button class="tl '+k+(current===k?' on':'')+'" onclick="setDraft('+ei+',\'tier\',\''+k+'\')">'+
       '<b>'+title+'</b><span>'+sub+'</span></button>';
  });
  h+='</div>';
  return h;
}
function setDraft(ei,k,v){ S.active.entries[ei].draft[k]=v; save(); render(); }
function inputDraft(ei,k,v){
  v=parseFloat(String(v).replace(',','.'));
  if(isNaN(v)||v<0) v=0;
  S.active.entries[ei].draft[k]=k==='r'?Math.round(v):v; save(); render();
}
function bump(ei,k,dir){
  const en=S.active.entries[ei];
  const step=k==='w'?(en.step||2.5):1;
  let v=(en.draft[k]||0)+dir*step;
  if(v<0)v=0;
  en.draft[k]=k==='r'?Math.round(v):Math.round(v*100)/100;
  save(); render();
}
function logSet(ei){
  const en=S.active.entries[ei];
  const d=en.draft;
  if(!d.r){ showToast('Укажи количество повторов'); return; }
  if(!en.bw && !d.tier){ showToast('Отметь, насколько тяжело дался подход'); return; }
  const priorE1s=en.sets.map(e1rmOfSet).filter(Boolean);
  const histBest=en.bw?null:currentE1RM({name:en.name,bw:false,seedE1RM:null});
  const prevBest=en.bw?null:(Math.max(histBest||0,...priorE1s,0)||null);
  en.sets.push({w:en.bw?0:d.w, r:d.r, tier:en.bw?null:d.tier});
  if(!en.bw){
    const newE1=e1rmOfSet(en.sets[en.sets.length-1]);
    if(newE1 && (!prevBest || newE1>prevBest+0.01)) showToast('🏆 Новый рекорд по '+en.name+'!');
  }
  // черновик следующего подхода: коррекция по цвету светофора
  const hint=nextSetHint({tier:en.tier,step:en.step,bw:en.bw},en.sets[en.sets.length-1]);
  if(hint&&!en.bw) en.draft.w=hint.w;
  en.draft.tier=null;
  save(); render();
  if(en.rest) restStart(en.rest);
}
function delSet(ei,si){ S.active.entries[ei].sets.splice(si,1); save(); render(); }
function extraSet(ei){ S.active.entries[ei].planSets++; save(); render(); }
function finishWorkout(){
  const entries=S.active.entries.filter(e=>e.sets.length).map(e=>({name:e.name,exId:e.exId,bw:e.bw,sets:e.sets}));
  if(!entries.length){
    confirmSheet('Ни один подход не записан. Завершить без сохранения?',function(){
      S.active=null; save(true); render();
    },{title:'Завершить без сохранения?',yes:'Завершить',danger:true});
    return;
  }
  const before=unlockedAchievementNames();
  S.history.push({id:uid(),date:new Date().toISOString(),dayId:S.active.dayId,dayName:S.active.dayName,
                  durMin:Math.round((Date.now()-S.active.startedAt)/60000),entries});
  const advanced=maybeAdvanceMesocycle();
  const newly=unlockedAchievementNames().filter(n=>!before.includes(n));
  S.active=null; restStop(); save(true); render();
  showToast(newly.length?('🏆 Новое достижение: '+newly[0]+(newly.length>1?' (+'+(newly.length-1)+')':'')):'Тренировка сохранена ✓');
  if(advanced) setTimeout(()=>{ infoSheet('Мезоцикл завершён — стартовый объём каждого упражнения вырос на 1 подход (пока не достигнет потолка в 6). Дальше цикл идёт с нового, более высокого уровня.','Мезоцикл завершён'); },300);
}
function cancelWorkout(){
  confirmSheet('Удалить текущую тренировку без сохранения?',function(){
    S.active=null; restStop(); save(true); render();
  },{title:'Отменить тренировку?',yes:'Удалить',danger:true});
}

/* ============ таймер отдыха ============ */
let restEnd=0, restTotal=0, restIv=null, audioCtx=null;
function beep(){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value=880; g.gain.setValueAtTime(.4,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.6);
    o.start(); o.stop(audioCtx.currentTime+.6);
  }catch(e){}
}
document.addEventListener('touchstart',function once(){ try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();}catch(e){} document.removeEventListener('touchstart',once); },{once:true});
function restStart(sec){
  restTotal=sec; restEnd=Date.now()+sec*1000;
  $('restbar').classList.add('show');
  document.body.classList.add('resting');
  clearInterval(restIv); restIv=setInterval(restTick,250); restTick();
}
const RING_C=2*Math.PI*27;
function restTick(){
  const left=Math.max(0,restEnd-Date.now());
  const s=Math.ceil(left/1000);
  $('restT').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const frac=restTotal?left/(restTotal*1000):0;
  $('restRing').style.strokeDashoffset=(RING_C*(1-frac)).toFixed(1);
  if(left<=0){ restStop(); beep(); showToast('⏱ Отдых окончен'); }
}
function restAdd(s){ restEnd+=s*1000; restTotal+=s; restTick(); }
function restStop(){ clearInterval(restIv); $('restbar').classList.remove('show'); document.body.classList.remove('resting'); }

/* ============ прогресс ============ */
function allExerciseNames(){
  const set=new Set();
  S.program.days.forEach(d=>d.exercises.forEach(e=>set.add(e.name)));
  S.history.forEach(w=>w.entries.forEach(e=>set.add(e.name)));
  return [...set];
}
function vProgress(){
  const names=allExerciseNames();
  if(!names.length) return '<div class="empty">Нет данных</div>';
  if(!S.ui.progressEx||!names.includes(S.ui.progressEx)) S.ui.progressEx=names[0];
  let options='';
  names.forEach(n=>{ options+='<option value="'+esc(n)+'"'+(S.ui.progressEx===n?' selected':'')+'>'+esc(n)+'</option>'; });
  const pts=seriesFor(S.ui.progressEx);
  let stats='<div class="empty">Пока нет записанных подходов — прогресс появится после первой тренировки.</div>';
  if(pts.length){
    const last=pts[pts.length-1], best=pts.reduce((a,b)=>b.e1rm>a.e1rm?b:a,pts[0]);
    const first=pts[0];
    const delta=last.e1rm-first.e1rm;
    stats='<div class="row" style="justify-content:space-around;text-align:center;margin:10px 0 4px">'+
      '<div><div class="bigw">'+fmtW(last.e1rm)+'<small> кг</small></div><div class="muted">расч. 1ПМ сейчас</div></div>'+
      '<div><div class="bigw">'+fmtW(best.e1rm)+'<small> кг</small></div><div class="muted">рекорд</div></div>'+
      '<div><div class="bigw" style="color:'+(delta>=0?'var(--green)':'var(--red)')+'">'+(delta>=0?'+':'')+fmtW(delta)+'</div><div class="muted">с начала</div></div>'+
    '</div><div id="chart"></div>';
  }
  let table='';
  lastResults(S.ui.progressEx,8).forEach(r=>{
    const s=r.sets.map(x=>(x.w?fmtW(x.w)+'×':'')+x.r+(x.tier?' <span class="tl-dot '+x.tier+'"></span>':'')).join(' · ');
    table+='<div class="setline"><span class="muted" style="min-width:64px;font-size:13px">'+fmtDate(r.date)+'</span><span class="mono grow" style="font-size:13px">'+s+'</span></div>';
  });
  return '<div class="card"><div class="fieldlbl">Упражнение</div>'+
         '<div class="ddWrap" style="margin-bottom:6px"><select class="ddSelect" onchange="selectProgressEx(this.value)">'+options+'</select><span class="ddArrow">▾</span></div>'+
         stats+'</div>'+
         (table?('<div class="card"><h2>Последние тренировки</h2>'+table+'</div>'):'');
}
function selectProgressEx(v){ S.ui.progressEx=v; save(); render(); }
function seriesFor(name){
  const pts=[];
  S.history.forEach(w=>{
    for(const en of w.entries){
      if(en.name!==name) continue;
      let best=null;
      en.sets.forEach(s=>{const v=e1rmOfSet(s);if(v&&(!best||v>best))best=v;});
      if(en.bw){ best=Math.max(...en.sets.map(s=>s.r||0)); } // для собств. веса — макс повторы
      if(best) pts.push({date:w.date,e1rm:Math.round(best*10)/10,ton:tonnage(en)});
    }
  });
  return pts;
}
function drawChart(){
  const el=$('chart'); if(!el) return;
  const pts=seriesFor(S.ui.progressEx).slice(-24);
  if(pts.length<2){ el.innerHTML='<div class="muted" style="text-align:center;padding:8px">График появится после второй тренировки с этим упражнением</div>'; return; }
  const W=el.clientWidth||320, H=160, P=8;
  const vs=pts.map(p=>p.e1rm);
  let mn=Math.min(...vs), mx=Math.max(...vs);
  if(mx-mn<2){ mx+=1; mn-=1; }
  const x=i=>P+(W-2*P)*i/(pts.length-1);
  const y=v=>H-P-(H-2*P)*(v-mn)/(mx-mn);
  let path='',dots='';
  pts.forEach((p,i)=>{ path+=(i?'L':'M')+x(i).toFixed(1)+' '+y(p.e1rm).toFixed(1)+' '; });
  pts.forEach((p,i)=>{ dots+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.e1rm).toFixed(1)+'" r="3.5" fill="var(--blue)"/>'; });
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+
    '<text x="'+P+'" y="14" fill="var(--dim)" font-size="11" font-family="var(--mono)">'+fmtW(mx)+'</text>'+
    '<text x="'+P+'" y="'+(H-4)+'" fill="var(--dim)" font-size="11" font-family="var(--mono)">'+fmtW(mn)+'</text>'+
    '<path d="'+path+'" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'</svg>';
}

/* ============ мезоцикл: "блины на грифе" — сигнатурная визуализация ============ */
function mesoTrack(current){
  const sizes=[48,58,68,40];
  const cols=['var(--tGreen)','var(--tYellow)','var(--tRed)','var(--blue)'];
  const labels=['Нед 1','Нед 2','Нед 3','Разгр.'];
  let h='<div class="meso">';
  for(let i=0;i<4;i++){
    const wk=i+1, active=wk===current;
    h+='<div class="mesoItem'+(active?' active':'')+'">'+
       '<div class="mesoPlateWrap"><div class="mesoPlate" style="width:'+sizes[i]+'px;height:'+sizes[i]+'px;--pc:'+cols[i]+'">'+wk+'</div></div>'+
       '<span class="mesoLbl">'+labels[i]+'</span></div>';
  }
  h+='</div>';
  return h;
}
function mesoCard(week){
  const descs={1:'старт цикла у минимально эффективного объёма (MEV) · цель — зелёный',2:'плюс подходы к жёлтой середине пути',3:'пиковая неделя — объём у восстановимого максимума (MRV) · цель — красный',4:'≈50% от пикового объёма — разгрузка для суперкомпенсации перед новым циклом'};
  return '<div class="card"><h2>Мезоцикл</h2>'+mesoTrack(week)+
    '<p class="muted" style="margin-top:10px">Сейчас: <b style="color:var(--ink)">'+weekLabel(week)+'</b> — '+descs[week]+'.</p>'+
    '<p class="muted" style="margin-top:6px;font-size:11.5px">После каждого завершённого цикла (12 тренировок) стартовый объём обычных упражнений растёт на 1 подход, до потолка в '+MEV_CAP+' — MEV подстраивается под растущую тренированность (принцип объёмных ориентиров Israetel, Renaissance Periodization, синтезирующий дозозависимые данные Schoenfeld et al., 2017). У тяжёлых базовых движений (присед, становая, жимы штанги) число подходов долгосрочно не растёт — по данным RP у них ниже и уже восстановимый объём, поэтому их прогрессия идёт через вес и приближение к отказу, а не через рост числа подходов.</p></div>';
}

/* ============ календарь ============ */
let calView=null;
function ensureCalView(){ if(!calView){ const d=new Date(); calView={y:d.getFullYear(),m:d.getMonth()}; } }
function calShift(delta){
  ensureCalView();
  let m=calView.m+delta, y=calView.y;
  if(m<0){m=11;y--;} if(m>11){m=0;y++;}
  calView={y,m}; render();
}
function workoutsByDate(){
  const map={};
  S.history.forEach((w,i)=>{
    const key=localDateKey(new Date(w.date));
    const dayIdx=S.program.days.findIndex(d=>d.id===w.dayId);
    (map[key]=map[key]||[]).push({w,dayIdx,week:weekInCycleForIndex(i)});
  });
  return map;
}
function calendarGridHTML(){
  ensureCalView();
  const {y,m}=calView;
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const todayKey=localDateKey(new Date());
  const map=workoutsByDate();
  const monthName=first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  let cells='';
  for(let i=0;i<startDow;i++) cells+='<div class="calCell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const key=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const items=map[key];
    let dots='';
    if(items) items.slice(0,3).forEach(it=>{ dots+='<span class="calDot d'+(it.dayIdx>=0?it.dayIdx:0)+'"></span>'; });
    cells+='<div class="calCell'+(key===todayKey?' today':'')+(items?' has':'')+'"'+
      (items?(' onclick="openDayDetail(\''+key+'\')"'):'')+'>'+
      '<span class="calNum">'+d+'</span><div class="calDots">'+dots+'</div></div>';
  }
  let legend='';
  S.program.days.forEach((d,i)=>{ legend+='<span class="legendItem"><span class="calDot d'+i+'"></span>'+esc(d.name)+'</span>'; });
  return '<div class="card">'+
    '<div class="row" style="margin-bottom:10px">'+
    '<button class="icon-btn sm" onclick="calShift(-1)">‹</button>'+
    '<h2 class="grow" style="text-align:center;text-transform:capitalize">'+monthName+'</h2>'+
    '<button class="icon-btn sm" onclick="calShift(1)">›</button></div>'+
    '<div class="calWeekdays">'+['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<span>'+x+'</span>').join('')+'</div>'+
    '<div class="calGrid">'+cells+'</div>'+
    '<div class="calLegend">'+legend+'</div></div>';
}
function openDayDetail(key){
  const items=(workoutsByDate())[key]||[];
  if(!items.length) return;
  let body='<h3>'+new Date(key+'T00:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+'</h3>';
  items.forEach(({w,week})=>{
    const ton=w.entries.reduce((a,e)=>a+tonnage(e),0);
    body+='<div class="hint" style="margin-bottom:10px"><b>'+esc(w.dayName)+'</b> · '+weekLabel(week)+' · '+w.durMin+' мин'+(ton?(' · '+Math.round(ton)+' кг тоннаж'):'')+'</div>';
    w.entries.forEach(en=>{
      const s=en.sets.map(x=>(x.w?fmtW(x.w)+'×':'')+x.r+(x.tier?' <span class="tl-dot '+x.tier+'"></span>':'')).join(' · ');
      body+='<div class="setline"><span class="grow" style="font-size:14px">'+esc(en.name)+'</span></div>'+
            '<div class="mono muted" style="font-size:13px;padding-bottom:6px">'+s+'</div>';
    });
    body+='<button class="btn danger sm" style="margin-top:4px;margin-bottom:14px" onclick="delWorkout(\''+w.id+'\')">Удалить запись</button>';
  });
  body+='<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Закрыть</button>';
  openSheet(body);
}
function vCalendar(){
  if(!S.history.length && !Object.keys(workoutsByDate()).length){
    return mesoCard(currentWeekInCycle())+calendarGridHTML()+
      '<div class="empty">Пройденные тренировки появятся здесь как точки на датах. Нажми на дату с точкой, чтобы увидеть детали.</div>';
  }
  return mesoCard(currentWeekInCycle())+calendarGridHTML();
}

/* ============ результаты / достижения ============ */
function totalTonnageAll(){ return S.history.reduce((a,w)=>a+w.entries.reduce((b,e)=>b+tonnage(e),0),0); }
function totalMinutesAll(){ return S.history.reduce((a,w)=>a+(w.durMin||0),0); }
function distinctExerciseCount(){ const s=new Set(); S.history.forEach(w=>w.entries.forEach(e=>s.add(e.name))); return s.size; }
function completedMesocycles(){ return Math.floor(S.history.length/12); }
function totalPRCount(){
  const best={}; let n=0;
  S.history.forEach(w=>w.entries.forEach(en=>{
    if(en.bw) return;
    let top=null;
    en.sets.forEach(s=>{ const v=e1rmOfSet(s); if(v&&(!top||v>top)) top=v; });
    if(top && (!best[en.name] || top>best[en.name]+0.01)){ best[en.name]=top; n++; }
  }));
  return n;
}
function weekKeyOf(iso){
  const d=new Date(iso); const dow=(d.getDay()+6)%7;
  d.setHours(0,0,0,0); d.setDate(d.getDate()-dow);
  return localDateKey(d);
}
function currentWeekStreak(){
  if(!S.history.length) return 0;
  const weeks=new Set(S.history.map(w=>weekKeyOf(w.date)));
  const thisWeek=weekKeyOf(new Date());
  let cursor=new Date(thisWeek+'T00:00:00');
  if(!weeks.has(thisWeek)) cursor.setDate(cursor.getDate()-7);
  let streak=0;
  while(weeks.has(localDateKey(cursor))){ streak++; cursor.setDate(cursor.getDate()-7); }
  return streak;
}
function bestRecordFor(name){
  let best=null,date=null,bw=false;
  S.history.forEach(w=>w.entries.forEach(en=>{
    if(en.name!==name) return;
    if(en.bw){
      bw=true;
      const mx=Math.max(0,...en.sets.map(s=>s.r||0));
      if(mx&&(!best||mx>best)){best=mx;date=w.date;}
    } else {
      en.sets.forEach(s=>{ const v=e1rmOfSet(s); if(v&&(!best||v>best)){best=v;date=w.date;} });
    }
  }));
  return {value:best,date,bw};
}
function countAchievements(total){
  return [[1,'Первая тренировка','Записана первая тренировка'],[10,'Втянулся','10 тренировок в журнале'],
    [25,'Стабильность','25 тренировок'],[50,'Полтинник','50 тренировок'],
    [100,'Сотня','100 тренировок'],[200,'Двести','200 тренировок']]
    .map(([n,name,desc])=>({name,desc,unlocked:total>=n,progress:total+'/'+n}));
}
function tonnageAchievements(t){
  return [[10000,'10 тонн'],[50000,'50 тонн'],[100000,'100 тонн'],[500000,'500 тонн'],[1000000,'Мегатоннаж']]
    .map(([n,name])=>({name,desc:'Суммарный тоннаж '+n.toLocaleString('ru-RU')+' кг',unlocked:t>=n,progress:Math.round(t).toLocaleString('ru-RU')+'/'+n.toLocaleString('ru-RU')}));
}
function streakAchievements(s){
  return [[2,'Есть ритм','2 недели подряд с тренировками'],[4,'Месяц в форме','4 недели подряд'],[12,'Квартал дисциплины','12 недель подряд']]
    .map(([n,name,desc])=>({name,desc,unlocked:s>=n,progress:s+'/'+n}));
}
function mesoAchievements(m){
  return [[1,'Первый мезоцикл','Завершён первый 12-тренировочный цикл'],[3,'Опытный','3 завершённых мезоцикла'],[6,'Ветеран','6 завершённых мезоциклов']]
    .map(([n,name,desc])=>({name,desc,unlocked:m>=n,progress:m+'/'+n}));
}
function prAchievements(p){
  return [[1,'Первый рекорд','Побит первый личный рекорд'],[10,'Рекордсмен','10 личных рекордов'],[25,'Машина прогресса','25 личных рекордов']]
    .map(([n,name,desc])=>({name,desc,unlocked:p>=n,progress:p+'/'+n}));
}
function miscAchievements(){
  const ex=distinctExerciseCount(), hrs=Math.floor(totalMinutesAll()/60);
  return [
    {name:'Универсал',desc:'Освоено 10 разных упражнений',unlocked:ex>=10,progress:ex+'/10'},
    {name:'Марафонец',desc:'24 часа суммарного времени тренировок',unlocked:hrs>=24,progress:hrs+'/24 ч'}
  ];
}
function allAchievementItems(){
  return [].concat(
    countAchievements(S.history.length),
    tonnageAchievements(totalTonnageAll()),
    streakAchievements(currentWeekStreak()),
    mesoAchievements(completedMesocycles()),
    prAchievements(totalPRCount()),
    miscAchievements()
  );
}
function unlockedAchievementNames(){ return allAchievementItems().filter(a=>a.unlocked).map(a=>a.name); }
function achievementCategory(icon,title,items){
  const n=items.filter(i=>i.unlocked).length;
  let rows='';
  items.forEach(it=>{
    rows+='<div class="setline" style="opacity:'+(it.unlocked?'1':'.5')+'">'+
      '<span style="font-size:17px">'+(it.unlocked?'✅':'⬜️')+'</span>'+
      '<span class="grow"><span style="font-size:14px">'+esc(it.name)+'</span>'+
      '<div class="muted" style="font-size:12px">'+esc(it.desc)+'</div></span>'+
      (it.unlocked?'':'<span class="mono muted" style="font-size:11.5px">'+esc(it.progress)+'</span>')+
    '</div>';
  });
  return '<details class="card"><summary class="row"><span style="font-size:19px">'+icon+'</span>'+
    '<div class="grow"><h2>'+esc(title)+'</h2></div><span class="tag">'+n+'/'+items.length+'</span></summary>'+rows+'</details>';
}
function statBlock(val,label){
  return '<div><div class="bigw">'+val+'</div><div class="muted" style="font-size:11px">'+esc(label)+'</div></div>';
}
function weekWord(n){ if(n%10===1&&n%100!==11) return 'неделя'; if([2,3,4].includes(n%10)&&![12,13,14].includes(n%100)) return 'недели'; return 'недель'; }
function vResults(){
  if(!S.history.length) return '<div class="empty">Здесь появятся результаты и достижения.<br>Заверши первую тренировку во вкладке «Тренировка».</div>';
  const total=S.history.length, streak=currentWeekStreak(), ton=Math.round(totalTonnageAll());
  let h='<div class="card"><h2>Сводка</h2><div class="row" style="justify-content:space-around;text-align:center;margin-top:10px;flex-wrap:wrap;gap:14px">'+
    statBlock(total,'тренировок')+
    statBlock(streak,streak+' '+weekWord(streak)+' подряд')+
    statBlock(ton.toLocaleString('ru-RU'),'кг тоннажа всего')+
    '</div></div>';
  h+=achievementCategory('🏋️','Тренировки',countAchievements(total));
  h+=achievementCategory('🏔','Тоннаж',tonnageAchievements(ton));
  h+=achievementCategory('🔥','Серии',streakAchievements(streak));
  h+=achievementCategory('🌀','Мезоциклы',mesoAchievements(completedMesocycles()));
  h+=achievementCategory('🏆','Личные рекорды',prAchievements(totalPRCount()));
  h+=achievementCategory('🎯','Разное',miscAchievements());
  let prRows='';
  allExerciseNames().slice().sort((a,b)=>a.localeCompare(b,'ru')).forEach(n=>{
    const r=bestRecordFor(n);
    if(r.value==null) return;
    prRows+='<div class="setline"><span class="grow" style="font-size:14px">'+esc(n)+'</span>'+
      '<span class="mono" style="font-size:13.5px">'+(r.bw?(r.value+' повт.'):(fmtW(r.value)+' кг 1ПМ'))+'</span></div>';
  });
  if(prRows) h+='<div class="card"><h2>Рекорды по упражнениям</h2>'+prRows+'</div>';
  return h;
}
function delWorkout(id){
  confirmSheet('Удалить эту тренировку из истории?',function(){
    S.history=S.history.filter(w=>w.id!==id); save(true); render();
  },{title:'Удалить запись?',yes:'Удалить',danger:true});
}

/* ============ настройки / данные ============ */
function openSettings(){
  const configured=cloudConfigured();
  let syncBlock;
  if(configured){
    syncBlock='<h3>Синхронизация</h3>'+
      '<div class="hint">Вошёл как <b>'+esc(cloud.nick||'—')+'</b></div>'+
      '<div class="hint" id="syncStatus" style="margin-top:8px">'+syncStatusText()+'</div>'+
      '<button class="btn ghost" style="margin-top:10px" onclick="cloudPush()">Синхронизировать сейчас</button>'+
      '<div class="muted" style="margin-top:10px;font-size:12px">Чтобы связать другое устройство, войди там в настройках синхронизации с тем же никнеймом и ключом.</div>'+
      '<button class="btn danger" style="margin-top:14px" onclick="disconnectCloud()">Выйти из аккаунта</button>';
  } else {
    syncBlock='<h3>Синхронизация между устройствами</h3>'+
      '<p class="muted" style="margin-bottom:12px">Войди под своим никнеймом и ключом — тренировки будут сохраняться в облаке автоматически и станут доступны на любом устройстве, где ты войдёшь так же.</p>'+
      '<div class="frow"><div class="fieldlbl">Никнейм</div><input type="text" id="cfgNick" placeholder="например, nikita"></div>'+
      '<div class="frow"><div class="fieldlbl">Ключ</div><input type="password" id="cfgPass" placeholder="минимум 4 символа">'+
      '<div class="muted" style="margin-top:6px;font-size:12px">Придумай ключ при первом входе и используй его же на всех устройствах — вместе с никнеймом это и есть твой логин. Держи его в секрете: кто узнает никнейм и ключ, получит доступ к твоим тренировкам.</div></div>'+
      '<button class="btn" onclick="connectCloud()">Войти</button>';
  }
  openSheet(syncBlock+
    '<h3 style="margin-top:22px">Локальная копия</h3>'+
    '<p class="muted" style="margin-bottom:14px">Хранится в памяти браузера на этом устройстве'+(configured?' и дублируется в облако при каждом изменении':'')+'. Добавь сайт на экран «Домой» (Поделиться → На экран «Домой») — так надёжнее.</p>'+
    '<button class="btn ghost" onclick="exportData()">Экспорт в файл</button>'+
    '<label class="btn ghost" style="margin-top:10px;text-align:center">Импорт из файла<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label>'+
    '<button class="btn danger" style="margin-top:10px" onclick="resetAll()">Сбросить всё</button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Закрыть</button>');
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='progressia-'+localDateKey(new Date())+'.json';
  a.click();
}
function importData(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.program||!d.history) throw new Error('неверный формат');
      S=migrateState(d); save(true); closeSheet(); render();
      showToast('Данные загружены');
    }catch(e){ showToast('Не удалось импортировать: '+e.message); }
  };
  r.readAsText(f);
}
function resetAll(){
  confirmSheet('Удалить программу и всю историю? Действие необратимо.',function(){
    S=defaultState(); save(true); closeSheet(); render();
  },{title:'Сбросить всё?',yes:'Удалить всё',danger:true});
}
function openSheet(html){ $('sheet').innerHTML=html; $('sheetwrap').classList.add('show'); }
function closeSheet(){ $('sheetwrap').classList.remove('show'); }

/* ============ свои диалоги подтверждения/ввода (вместо window.confirm/prompt/alert,
   которые в песочнице предпросмотра могут молча блокироваться) ============ */
function confirmSheet(message,onYes,opts){
  opts=opts||{};
  window.__confirmYes=onYes;
  const cls='btn'+(opts.danger?' danger':'');
  openSheet('<h3>'+esc(opts.title||'Подтверди действие')+'</h3>'+
    '<p class="muted" style="margin-bottom:18px">'+esc(message)+'</p>'+
    '<button class="'+cls+'" onclick="__runConfirmYes()">'+esc(opts.yes||'Да')+'</button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Отмена</button>');
}
function __runConfirmYes(){ const cb=window.__confirmYes; window.__confirmYes=null; closeSheet(); if(cb) cb(); }
function promptSheet(title,defVal,onOk){
  window.__promptOk=onOk;
  openSheet('<h3>'+esc(title)+'</h3>'+
    '<div class="frow"><input type="text" id="promptInput" value="'+esc(defVal||'')+'"></div>'+
    '<button class="btn" onclick="__runPromptOk()">Сохранить</button>'+
    '<button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Отмена</button>');
  setTimeout(()=>{ const el=$('promptInput'); if(el){ el.focus(); el.select(); } },60);
}
function __runPromptOk(){ const el=$('promptInput'); const v=el?el.value:''; const cb=window.__promptOk; window.__promptOk=null; closeSheet(); if(cb) cb(v); }
function infoSheet(message,title){
  openSheet('<h3>'+esc(title||'Готово')+'</h3><p class="muted" style="margin-bottom:18px">'+esc(message)+'</p>'+
    '<button class="btn ghost" onclick="closeSheet()">Понятно</button>');
}

render();
if(S.active) setTab('workout');
initCloud();
</script>
